<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="book" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 열린 성경책 -->
  <g transform="translate(256 268)">
    <!-- 왼쪽 페이지 -->
    <path d="M-6,-92 C-58,-92 -108,-72 -142,-44 L-142,88 C-108,60 -58,40 -6,40 Z" fill="url(#book)" opacity="0.95"/>
    <!-- 오른쪽 페이지 -->
    <path d="M6,-92 C58,-92 108,-72 142,-44 L142,88 C108,60 58,40 6,40 Z" fill="url(#book)"/>
    <!-- 책등 -->
    <rect x="-6" y="-92" width="12" height="132" rx="6" fill="#312e81"/>
    <!-- 글씨 라인 좌 -->
    <g stroke="#a5b4fc" stroke-width="5" stroke-linecap="round" opacity="0.9">
      <line x1="-96" y1="-58" x2="-28" y2="-58"/>
      <line x1="-96" y1="-34" x2="-28" y2="-34"/>
      <line x1="-96" y1="-10" x2="-42" y2="-10"/>
      <line x1="-28" y1="-58" x2="-28" y2="-10"/>
    </g>
    <!-- 글씨 라인 우 -->
    <g stroke="#818cf8" stroke-width="5" stroke-linecap="round" opacity="0.9">
      <line x1="28" y1="-58" x2="96" y2="-58"/>
      <line x1="28" y1="-34" x2="96" y2="-34"/>
      <line x1="42" y1="-10" x2="96" y2="-10"/>
    </g>
  </g>

  <!-- 불꽃 (말씀의 빛) -->
  <g transform="translate(372 96)">
    <path d="M0,34 C-26,8 -16,-26 2,-48 C14,-62 24,-62 28,-48 C34,-24 34,4 38,20 C44,-4 54,-26 66,-40 C74,-24 72,2 58,22 C50,34 26,44 0,34 Z"
          fill="url(#flame)"/>
    <circle cx="-20" cy="-16" r="10" fill="#fde68a" opacity="0.95"/>
  </g>
</svg>

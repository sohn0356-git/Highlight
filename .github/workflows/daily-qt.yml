name: Daily QT Fetcher

on:
  schedule:
    # 매일 UTC 15:05 (한국시간 00:05)
    - cron: '5 15 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'QT 날짜 (YYYY-MM-DD, 비워두면 오늘)'
        required: false

jobs:
  fetch-qt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and store QT
        env:
          SUPABASE_URL: https://afrzmtwakfkujsnxwinb.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            node scripts/fetch-daily-qt.mjs "${{ github.event.inputs.date }}"
          else
            node scripts/fetch-daily-qt.mjs
          fi

name: Daily Talents Backup

on:
  schedule:
    # 매일 00:30 KST (= 15:30 UTC)
    - cron: '30 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run backup
        env:
          SUPABASE_URL: https://afrzmtwakfkujsnxwinb.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/backup-talents.mjs

      - name: Commit backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backup/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 달란트 일일 백업 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
            git push
          fi
